<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel UTE 2.0</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#f7f5fb;color:#302641}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d9cbea;border-radius:9px;padding:10px 14px;background:white;color:#54368c}button.primary{background:#6e46b4;color:white;border-color:#6e46b4}button:disabled{opacity:.5;cursor:not-allowed}aside{background:#fff;border-right:1px solid #e5dbf2;padding:22px;position:fixed;width:250px;inset:0 auto 0 0;overflow:auto}aside h1{font-size:22px;margin:0;color:#6e46b4}small{color:#726581}nav{display:grid;gap:7px;margin-top:25px}nav button{text-align:left;border:0}nav button.active{background:#eee6fa;font-weight:700}main{margin-left:250px;padding:24px 32px;max-width:1500px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #e5dbf2;padding-bottom:14px}h2{margin:0;font-size:25px}h3{margin-top:0}.card{background:white;border:1px solid #e5dbf2;border-radius:14px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.metric{font-size:32px;color:#6e46b4;font-weight:700}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}input,select,textarea{padding:10px;border:1px solid #d9cbea;border-radius:8px;background:white;color:#302641;min-width:0}label{display:grid;gap:5px;margin:10px 0;font-weight:600}textarea{min-height:85px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee7f5;vertical-align:top}th{color:#6c5d83;font-size:12px;text-transform:uppercase}td{overflow-wrap:anywhere}.scroll{overflow:auto}.warn{color:#8b4c13;background:#fff4df;padding:12px;border-radius:8px}.status{font-size:13px;font-weight:600;color:#54368c}dialog{border:1px solid #dfd3ee;border-radius:16px;width:min(620px,94vw);max-height:90vh;overflow:auto;padding:24px}dialog::backdrop{background:#30264177}.muted{color:#726581}.danger{color:#a32f4f}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:750px){aside{position:static;width:auto;border:0;padding:14px}nav{display:flex;overflow:auto;margin-top:12px}nav button{white-space:nowrap}main{margin:0;padding:16px}th,td{min-width:110px}.card{padding:14px}}
</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script></head><body><aside><h1>Panel UTE <small>2.0</small></h1><small>Unidad de Trayectoria Estudiantil</small><nav id="nav"></nav></aside><main><header><h2 id="heading">Resumen</h2><span id="status" class="status" role="status">Sin conexión configurada</span><button id="logout" hidden>Cerrar sesión</button></header><div id="notice" role="alert"></div><div id="view"></div></main><dialog id="editor"><form id="editform"><h3 id="editTitle"></h3><div id="fields"></div><div class="bar"><button type="submit" class="primary" id="save">Guardar</button><button type="button" id="cancel">Cancelar</button></div><div id="editError" role="alert"></div></form></dialog><script>
'use strict';
const $=id=>document.getElementById(id), root='ute_v2', modules={home:'Resumen',monitoring:'Monitoreo y seguimiento',referrals:'Derivaciones',cases:'Casos específicos',workshops:'Talleres',tasks:'Organización y tareas',bitacora:'Bitácora',settings:'Configuración'};
const student=[['nombre','Nombre estudiante'],['rut','RUT'],['programa','Programa',['PACE','Elijo','Trayectoria','Otro']],['cohorte','Cohorte','number'],['carrera','Carrera']];
const common=[['fecha','Fecha','date'],['responsable','Responsable'],['estado','Estado',['Pendiente','En curso','Cerrado']],['notas','Observaciones','textarea']];
const schemas={monitoring:[...student,['titulo','Novedad o acción de seguimiento'],...common],referrals:[...student,['titulo','Motivo de derivación'],['origen','Unidad de origen'],['destino','Unidad de destino'],['prioridad','Prioridad',['Regular','Urgente']],...common],cases:[...student,['titulo','Situación o necesidad'],['propuesta','Propuesta de apoyo','textarea'],...common],workshops:[['titulo','Nombre del taller'],['carrera','Carrera'],['area','Área'],['asistentes','Asistentes','number'],...common],tasks:[['titulo','Tarea o registro de gestión'],['tipo','Tipo',['Tarea','Registro de gestión']],['prioridad','Prioridad',['Regular','Urgente']],...common],bitacora:[...student,['titulo','Actividad o atención'],['area','Área',['Matemática','Alfabetización académica','Psicoeducativo','TAI','Otro']],['asistencia','Asistencia',['Asistió','No asistió','Cancelada']],...common]};
let current='home',db,auth,user,connected=false,authorized=false,records={},unsub=[],editing=null,query='',filter='',trash=false,ready=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(t){$('notice').textContent=t;$('notice').className=t?'warn':''}function status(t){$('status').textContent=t}function canWrite(){return !!(user&&authorized&&connected&&ready)}function active(m){return Object.values(records[m]||{}).filter(r=>!r.deleted)}function show(m){current=m;query='';filter='';trash=false;render()}function nav(){ $('nav').replaceChildren(...Object.entries(modules).map(([k,v])=>{let b=document.createElement('button');b.textContent=v;b.className=k===current?'active':'';b.onclick=()=>show(k);return b}))}
function render(){nav();$('heading').textContent=modules[current];$('logout').hidden=!user;if(!authorized){if(current!=='settings'&&user){$('view').innerHTML='<div class="card">Esperando autorización o acceso a la base. Revisa Configuración.</div>';return}settings();return}if(current==='settings'){settings();return}if(!ready){$('view').innerHTML='<div class="card">Cargando registros confirmados…</div>';return}if(current==='home'){let n=active('bitacora').filter(r=>r.asistencia==='Asistió'),unique=new Set(n.map(r=>String(r.rut||'').replace(/[^0-9kK]/g,'').toUpperCase()).filter(Boolean));$('view').innerHTML='<div class="grid">'+Object.keys(schemas).map(k=>`<div class="card"><small>${modules[k]}</small><div class="metric">${active(k).length}</div></div>`).join('')+`</div><div class="card"><h3>Acompañamiento</h3><div class="grid"><div><small>Asistencias efectivas</small><div class="metric">${n.length}</div></div><div><small>Estudiantes únicos con RUT</small><div class="metric">${unique.size}</div></div></div></div><div class="card"><h3>Acciones rápidas</h3><div class="bar" id="quick"></div></div>`;for(const k of ['referrals','cases','tasks']){let b=document.createElement('button');b.textContent='Nuevo · '+modules[k];b.disabled=!canWrite();b.onclick=()=>{show(k);openEditor()};$('quick').append(b)}return}list()}
function list(){let arr=Object.entries(records[current]||{}).filter(([id,r])=>!!r.deleted===trash);let q=query.toLowerCase();arr=arr.filter(([id,r])=>Object.values(r).filter(v=>typeof v==='string').some(v=>v.toLowerCase().includes(q))&&(!filter||r.programa===filter));arr.sort((a,b)=>String(b[1].fecha||'').localeCompare(String(a[1].fecha||'')));let extra=current==='bitacora'?`<div class="card"><h3>Indicadores de asistencia</h3>${['PACE','Elijo','Trayectoria','Otro'].map(p=>[2025,2026].map(y=>{let a=active('bitacora').filter(r=>r.programa===p&&Number(r.cohorte)===y&&r.asistencia==='Asistió');return `<p>${p} ${y}: <b>${new Set(a.map(r=>String(r.rut||'').replace(/[^0-9kK]/g,'').toUpperCase()).filter(Boolean)).size}</b> estudiantes · ${a.length} asistencias</p>`}).join('')).join('')}</div>`:'';$('view').innerHTML=`<div class="bar"><button id="new" class="primary" ${canWrite()&&!trash?'':'disabled'}>+ Nuevo registro</button><input id="search" placeholder="Buscar registros" value="${esc(query)}"><select id="filter"><option value="">Todos los programas</option>${['PACE','Elijo','Trayectoria','Otro'].map(p=>`<option ${filter===p?'selected':''}>${p}</option>`).join('')}</select><button id="trash">${trash?'Ver activos':'Papelera'}</button></div><div class="card scroll"><small>${arr.length} registros</small><table><thead><tr><th>Registro</th><th>Fecha</th><th>Responsable</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${arr.map(([id,r])=>`<tr><td><b>${esc(r.nombre||r.titulo)}</b><br>${esc(r.nombre?r.titulo:r.carrera||'')}<br><small>${esc(r.programa||'')} ${esc(r.cohorte||'')}</small></td><td>${esc(r.fecha)}</td><td>${esc(r.responsable)}</td><td>${esc(r.estado)}</td><td><button data-id="${esc(id)}" data-act="edit">Ver / editar</button> <button data-id="${esc(id)}" data-act="delete" class="danger" ${canWrite()?'':'disabled'}>${trash?'Restaurar':'Archivar'}</button></td></tr>`).join('')}</tbody></table>${arr.length?'':'<p class="muted">No hay registros para mostrar.</p>'}</div>${extra}`;$('new').onclick=()=>openEditor();$('search').oninput=e=>{query=e.target.value;let pos=e.target.selectionStart;list();$('search').focus();$('search').setSelectionRange(pos,pos)};$('filter').onchange=e=>{filter=e.target.value;list()};$('filter').hidden=!schemas[current].some(f=>f[0]==='programa');$('trash').onclick=()=>{trash=!trash;list()};$('view').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>b.dataset.act==='edit'?openEditor(b.dataset.id):toggleDeleted(b.dataset.id))}
function openEditor(id){let r=id?records[current][id]:{};editing={module:current,id:id||null,rev:r.rev||0};$('editTitle').textContent=id?'Detalle del registro':'Nuevo registro';$('editError').textContent='';$('fields').innerHTML=schemas[current].map(([k,l,t])=>{let v=r[k]??(k==='fecha'?new Date().toLocaleDateString('sv-SE'):'');let required=['titulo','nombre','rut'].includes(k)?'required':'';let field=Array.isArray(t)?`<select name="${k}">${t.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`:t==='textarea'?`<textarea name="${k}">${esc(v)}</textarea>`:`<input name="${k}" type="${t||'text'}" value="${esc(v)}" ${required} ${t==='number'?'min="0" step="1"':''}>`;return `<label>${l}${field}</label>`}).join('');$('save').disabled=!canWrite()||!!r.deleted;$('editor').showModal()}
$('cancel').onclick=()=>$('editor').close();$('editform').onsubmit=async e=>{e.preventDefault();let ed=editing,data=Object.fromEntries(new FormData(e.target));$('save').disabled=true;try{await write(ed.module,ed.id,ed.rev,data,false);$('editor').close()}catch(err){$('editError').textContent=err.message;$('save').disabled=!canWrite()}};
async function write(m,id,rev,data,deleted){if(!canWrite())throw Error('Sin conexión confirmada o sin permisos. Conserva el formulario abierto y reintenta.');let ref=id?db.ref(`${root}/${m}/${id}`):db.ref(`${root}/${m}`).push();let stamp=Date.now();status('Guardando…');try{let result=await ref.transaction(old=>{if((old?.rev||0)!==rev)return;let history={...(old?.history||{})};if(old){let {history:_,...previous}=old;history['v'+old.rev]=previous}return {...data,deleted,rev:rev+1,updatedAt:stamp,updatedBy:user.uid,history}},undefined,false);if(!result.committed)throw Error('Conflicto de edición: vuelve a abrir el registro antes de guardar.');status('Guardado confirmado en Firebase');}catch(e){status('Guardado no confirmado');throw e}}
async function toggleDeleted(id){let r=records[current][id];if(!confirm(r.deleted?'¿Restaurar este registro?':'¿Mover este registro a la papelera?'))return;let {history,rev,updatedAt,updatedBy,deleted,...data}=r;try{await write(current,id,rev,data,!deleted)}catch(e){message(e.message)}}
function settings(){let config=localStorage.getItem('ute2-config')||'';$('view').innerHTML=`<div class="card"><h3>Conexión segura</h3><p>Usa un proyecto Firebase nuevo, sin datos anteriores. No ingreses información real hasta instalar las reglas y comprobar los respaldos.</p><label>Configuración web de Firebase (JSON)<textarea id="cfg" placeholder='{"apiKey":"…","authDomain":"…","databaseURL":"…","projectId":"…"}'>${esc(config)}</textarea></label><button id="connect" class="primary">Guardar configuración y conectar</button><div id="login" ${user?'hidden':''}><label>Correo<input id="email" type="email" autocomplete="username"></label><label>Contraseña<input id="password" type="password" autocomplete="current-password"></label><button id="signin">Iniciar sesión</button></div><p>Usuario: ${esc(user?.email||'Sin sesión')} · UID: ${esc(user?.uid||'—')}</p></div><div class="card"><h3>Respaldo y recuperación</h3><p>La exportación contiene todos los registros, papelera e historial. Guárdala en almacenamiento institucional protegido. No es un respaldo automático.</p><button id="export" ${canWrite()?'':'disabled'}>Descargar respaldo JSON confirmado</button><p class="muted">La restauración se realiza desde Firebase por un administrador, en una ruta de prueba. Los respaldos automáticos del servidor deben configurarse por separado.</p></div><div class="card"><h3>Archivo histórico</h3><p>Educación Parvularia y Escritura permanecen en el código anterior. No se migraron datos ni se modificó la base anterior.</p></div>`;$('connect').onclick=()=>{try{let c=JSON.parse($('cfg').value);if(!c.apiKey||!c.databaseURL||!c.projectId||!c.authDomain)throw Error('Configuración incompleta');if(/ee12026-f5e3d|trayectoria-2026/.test(JSON.stringify(c)))throw Error('Usa un proyecto nuevo, no los proyectos anteriores.');localStorage.setItem('ute2-config',JSON.stringify(c));location.reload()}catch(e){message(e.message)}};$('signin').onclick=async()=>{try{if(!auth)throw Error('Configura Firebase primero.');await auth.signInWithEmailAndPassword($('email').value,$('password').value)}catch(e){message(e.message)}};$('export').onclick=async()=>{try{if(!canWrite())throw Error('No hay conexión autorizada.');let token=await user.getIdToken();let url=db.ref(root).toString()+'.json?auth='+encodeURIComponent(token);let response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('Firebase no confirmó la lectura');let data=await response.json();let blob=new Blob([JSON.stringify({schema:2,exportedAt:new Date().toISOString(),data:data||{}},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='UTE2-respaldo-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);message('Archivo exportado. Verifica que se guardó en una ubicación protegida.')}catch(e){message(e.message)}}}
$('logout').onclick=()=>auth?.signOut();
function detach(){unsub.forEach(fn=>fn());unsub=[];records={};ready=false;authorized=false;if($('editor').open)$('editor').close()}
async function init(){render();try{let c=JSON.parse(localStorage.getItem('ute2-config')||'null');if(!c)return;firebase.initializeApp(c);auth=firebase.auth();db=firebase.database();db.ref('.info/connected').on('value',s=>{connected=s.val()===true;status(connected?'Conexión disponible':'Sin conexión · no guardado confirmado');render()});auth.onAuthStateChanged(u=>{detach();user=u;if(!u){status('Inicia sesión');render();return}let ref=db.ref(root);let cb=s=>{records=s.val()||{};authorized=true;ready=true;status(connected?'Conectado a Firebase':'Sin conexión');render()};let fail=e=>{detach();message('Acceso denegado o error: '+e.message);render()};ref.on('value',cb,fail);unsub.push(()=>ref.off('value',cb));render()})}catch(e){message('No se pudo iniciar Firebase: '+e.message)}}init();
</script></body></html>
